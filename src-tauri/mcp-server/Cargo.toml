[package]
name = "inkwell-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for inkwell — exposes vault notes to Claude"

[lib]
name = "inkwell_mcp"
path = "src/lib.rs"

[[bin]]
name = "inkwell-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
